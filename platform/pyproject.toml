[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mesh-experience-platform"
version = "0.1.0"
description = "面向内网的叶轮机械网格经验采集平台"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.141.1",
  "h5py==3.16.0",
  "numpy==2.5.1",
  "psutil==7.2.2",
  "pydantic==2.13.4",
  "python-multipart==0.0.32",
  "uvicorn==0.52.1",
]

[project.optional-dependencies]
test = [
  "httpx==0.28.1",
  "pytest==9.1.1",
]

[project.scripts]
mesh-api = "mesh_app.api:main"
mesh-worker = "mesh_app.worker:main"
mesh-backup = "mesh_app.backup:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["mesh_app*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
